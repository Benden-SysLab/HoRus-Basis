---
- name: Read controller credentials
  hosts: basis_targets
  gather_facts: false
  become: false
  vars_prompt:
    - name: keepass_master_password_prompt
      prompt: KeePass master password
      private: true
  tasks:
    - name: Keep KeePass password in controller memory
      ansible.builtin.set_fact:
        horus_keepass_master_password: "{{ keepass_master_password_prompt }}"
      delegate_to: localhost
      vars:
        ansible_become: false
        ansible_become_password: ""
      delegate_facts: true
      run_once: true
      no_log: true
      tags: [always]

    - name: Create protected controller SSH directory
      ansible.builtin.file:
        path: "{{ horus_controller_bootstrap_ssh_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      vars:
        ansible_become: false
        ansible_become_password: ""
      run_once: true
      tags: [always]

    - name: Check controller bootstrap SSH key sources
      ansible.builtin.stat:
        path: "{{ bootstrap_key.source }}"
      delegate_to: localhost
      vars:
        ansible_become: false
        ansible_become_password: ""
      loop: "{{ horus_ansible_bootstrap_key_files }}"
      loop_control:
        loop_var: bootstrap_key
        label: "{{ bootstrap_key.source | basename }}"
      register: controller_bootstrap_key_sources
      run_once: true
      no_log: true
      tags: [always]

    - name: Require every controller bootstrap SSH key
      ansible.builtin.assert:
        that:
          - >-
            controller_bootstrap_key_sources.results
            | map(attribute='stat.exists')
            | select('equalto', true)
            | list
            | length == horus_ansible_bootstrap_key_files | length
        fail_msg: >-
          One or more bootstrap SSH keys are missing from the configured
          Windows .ssh/horus source paths.
      delegate_to: localhost
      vars:
        ansible_become: false
        ansible_become_password: ""
      run_once: true
      no_log: true
      tags: [always]

    - name: Install protected controller bootstrap SSH keys
      ansible.builtin.copy:
        src: "{{ bootstrap_key.source }}"
        dest: "{{ bootstrap_key.destination }}"
        mode: "0600"
      delegate_to: localhost
      vars:
        ansible_become: false
        ansible_become_password: ""
      loop: "{{ horus_ansible_bootstrap_key_files }}"
      loop_control:
        loop_var: bootstrap_key
        label: "{{ bootstrap_key.destination | basename }}"
      run_once: true
      no_log: true
      tags: [always]
