---
- name: Read controller credentials
  hosts: basis_targets
  gather_facts: false
  become: false
  vars_prompt:
    - name: keepass_master_password_prompt
      prompt: KeePass master password
      private: true
  tasks:
    - name: Keep KeePass password in controller memory
      ansible.builtin.set_fact:
        horus_keepass_master_password: "{{ keepass_master_password_prompt }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true
      no_log: true
