---
- name: Install Wiki.js operating system dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - postgresql-client
      - tar
    state: present
    update_cache: true

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download NodeSource signing key
  ansible.builtin.get_url:
    url: "{{ wiki_nodesource_key_url }}"
    dest: /tmp/nodesource-repo.asc
    owner: root
    group: root
    mode: "0644"

- name: Convert NodeSource signing key
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - --output
      - "{{ wiki_nodesource_keyring_path }}"
      - /tmp/nodesource-repo.asc
  changed_when: false

- name: Find obsolete NodeSource 22 repository entries
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    file_type: file
    contains: 'deb\.nodesource\.com/node_22\.x'
    read_whole_file: true
  register: wiki_obsolete_nodesource_entries

- name: Remove obsolete NodeSource 22 repository entries
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ wiki_obsolete_nodesource_entries.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Configure NodeSource repository
  ansible.builtin.apt_repository:
    repo: "{{ wiki_nodesource_repository }}"
    filename: nodesource
    state: present

- name: Install supported Node.js runtime
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
    allow_downgrade: true

- name: Enforce configured Node.js major version
  ansible.builtin.shell: >-
    candidate="$(apt-cache madison nodejs | awk '$3 ~ /^{{ wiki_nodejs_major_version }}[.]/ {print $3; exit}')";
    case "$candidate" in
      {{ wiki_nodejs_major_version }}.*)
        apt-get install -y --allow-downgrades "nodejs=$candidate";
        ;;
      *)
        echo "No Node.js {{ wiki_nodejs_major_version }} candidate is available: $candidate" >&2;
        exit 1;
        ;;
    esac
  args:
    executable: /bin/bash
  register: wiki_node_install
  changed_when: "'0 upgraded' not in wiki_node_install.stdout"

- name: Read installed Node.js version
  ansible.builtin.command: node --version
  register: wiki_node_version
  changed_when: false

- name: Require supported Node.js major version
  ansible.builtin.assert:
    that:
      - (wiki_node_version.stdout | regex_replace('^v', '')).split('.')[0] | int == wiki_nodejs_major_version
    fail_msg: Wiki.js 2.5.x requires the configured Node.js 20 LTS runtime.

- name: Create Wiki.js system group
  ansible.builtin.group:
    name: "{{ wiki_system_group }}"
    system: true

- name: Create Wiki.js system user
  ansible.builtin.user:
    name: "{{ wiki_system_user }}"
    group: "{{ wiki_system_group }}"
    home: "{{ wiki_data_dir }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Create Wiki.js directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ wiki_install_root }}/releases", owner: root, group: root, mode: "0755"}
    - {path: "{{ wiki_release_dir }}", owner: "{{ wiki_system_user }}", group: "{{ wiki_system_group }}", mode: "0755"}
    - {path: "{{ wiki_data_dir }}", owner: "{{ wiki_system_user }}", group: "{{ wiki_system_group }}", mode: "0750"}
    - {path: "{{ wiki_log_dir }}", owner: "{{ wiki_system_user }}", group: "{{ wiki_system_group }}", mode: "0750"}

- name: Download Wiki.js release archive
  ansible.builtin.get_url:
    url: "{{ wiki_archive_url }}"
    dest: "/tmp/wiki-js-{{ wiki_version }}.tar.gz"
    owner: root
    group: root
    mode: "0644"

- name: Extract Wiki.js release
  ansible.builtin.unarchive:
    src: "/tmp/wiki-js-{{ wiki_version }}.tar.gz"
    dest: "{{ wiki_release_dir }}"
    remote_src: true
    creates: "{{ wiki_release_dir }}/server"
  register: wiki_release_extract
  notify: Restart Wiki.js

- name: Set Wiki.js release ownership
  ansible.builtin.file:
    path: "{{ wiki_release_dir }}"
    owner: "{{ wiki_system_user }}"
    group: "{{ wiki_system_group }}"
    recurse: true
  when: wiki_release_extract.changed

- name: Fix Wiki.js extract-files package exports
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json
    from pathlib import Path

    path = Path("{{ wiki_release_dir }}/node_modules/extract-files/package.json")
    data = json.loads(path.read_text())
    exports = data.setdefault("exports", {})
    required = {
        "./public/extractFiles": "./public/extractFiles.js",
        "./public/isExtractableFile": "./public/isExtractableFile.js",
        "./public/ReactNativeFile": "./public/ReactNativeFile.js",
    }
    changed = False
    for key, value in required.items():
        if exports.get(key) != value:
            exports[key] = value
            changed = True
    if changed:
        path.write_text(json.dumps(data, indent=2) + "\n")
    print("changed" if changed else "ok")
    PY
  args:
    executable: /bin/bash
  register: wiki_extract_files_exports
  changed_when: "'changed' in wiki_extract_files_exports.stdout"
  notify: Restart Wiki.js

- name: Link current Wiki.js release
  ansible.builtin.file:
    src: "{{ wiki_release_dir }}"
    dest: "{{ wiki_current_dir }}"
    state: link
    force: true
  notify: Restart Wiki.js

