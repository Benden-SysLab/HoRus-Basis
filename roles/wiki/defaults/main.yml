---
wiki_version: 2.5.315
wiki_service_name: wiki
wiki_system_user: wiki
wiki_system_group: wiki
wiki_install_root: /opt/wiki
wiki_release_dir: "{{ wiki_install_root }}/releases/{{ wiki_version }}"
wiki_current_dir: "{{ wiki_install_root }}/current"
wiki_archive_url: "https://github.com/Requarks/wiki/releases/download/v{{ wiki_version }}/wiki-js.tar.gz"
wiki_config_path: "{{ wiki_current_dir }}/config.yml"
wiki_data_dir: /var/lib/wiki
wiki_log_dir: /var/log/wiki
wiki_http_port: 3000
wiki_public_hostname: ""
wiki_public_url: ""

wiki_nodejs_major_version: 22
wiki_nodesource_key_url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
wiki_nodesource_keyring_path: /etc/apt/keyrings/nodesource.gpg
wiki_nodesource_repository: >-
  deb [signed-by={{ wiki_nodesource_keyring_path }}]
  https://deb.nodesource.com/node_{{ wiki_nodejs_major_version }}.x nodistro main

wiki_postgres_host: ""
wiki_postgres_port: 5432
wiki_postgres_database: ""
wiki_postgres_user: ""
wiki_postgres_password: ""
wiki_postgres_config_path: /etc/postgresql/17/horus/pg_hba.conf
wiki_postgres_service_name: postgresql@17-horus

wiki_bootstrap_email: ""
wiki_bootstrap_password: ""
wiki_bootstrap_marker: "{{ wiki_data_dir }}/.bootstrap-complete"

wiki_oidc_client_id: wiki
wiki_oidc_client_secret: ""
wiki_oidc_realm: ""
wiki_oidc_redirect_uri: "{{ wiki_public_url }}/login/*"
wiki_keycloak_host: horus-iam-srv01
wiki_keycloak_url: http://127.0.0.1:8080

wiki_nginx_host: horus-lb-srv01
wiki_nginx_upstream_address: ""
wiki_nginx_conf_path: /etc/nginx/conf.d/60_wiki.conf
wiki_nginx_manifest_path: /var/www/horus/services/wiki.json
wiki_nginx_tls_certificate: /etc/nginx/tls/horus-admin.crt
wiki_nginx_tls_key: /etc/nginx/tls/horus-admin.key

