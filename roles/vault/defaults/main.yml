---

vault_package_name: vault
vault_service_name: vault
vault_api_port: 8200
vault_cluster_port: 8201
vault_api_addr: ""
vault_cluster_addr: ""
vault_config_dir: /etc/vault.d
vault_config_path: /etc/vault.d/vault.hcl
vault_cert_dir: /etc/vault.d/tls
vault_cert_file: /etc/vault.d/tls/vault.crt
vault_key_file: /etc/vault.d/tls/vault.key
vault_tls_common_name: ""
vault_tls_subject_alt_name: ""
vault_log_dir: /var/log/vault
vault_key_shares: 5
vault_key_threshold: 3
vault_keepass_initialization_group: ""
vault_public_url: ""
vault_public_hostname: ""
vault_nginx_host: horus-lb-srv01
vault_nginx_upstream_address: ""
vault_nginx_upstream_port: 8200
vault_nginx_conf_path: /etc/nginx/conf.d/30_vault.conf
vault_nginx_manifest_path: /var/www/horus/services/vault.json
vault_nginx_tls_certificate: /etc/nginx/tls/horus-admin.crt
vault_nginx_tls_key: /etc/nginx/tls/horus-admin.key

vault_postgres_host: ""
vault_postgres_port: 5432
vault_postgres_database: ""
vault_postgres_user: ""
vault_postgres_password: ""

vault_repository_url: https://apt.releases.hashicorp.com
vault_repository_key_url: https://apt.releases.hashicorp.com/gpg
vault_repository_keyring: /etc/apt/keyrings/hashicorp.gpg
vault_repository_distribution: bookworm


