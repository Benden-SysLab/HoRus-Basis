---

- name: Install Vault NGINX service block
  ansible.builtin.template:
    src: nginx/30_vault.conf.j2
    dest: "{{ vault_nginx_conf_path }}"
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ vault_nginx_host }}"
  register: vault_nginx_block

- name: Install Vault dashboard manifest
  ansible.builtin.template:
    src: nginx/vault.json.j2
    dest: "{{ vault_nginx_manifest_path }}"
    owner: root
    group: www-data
    mode: "0644"
  delegate_to: "{{ vault_nginx_host }}"

- name: Validate NGINX after publishing Vault
  ansible.builtin.command: nginx -t
  delegate_to: "{{ vault_nginx_host }}"
  changed_when: false

- name: Reload NGINX after publishing Vault
  ansible.builtin.service:
    name: nginx
    state: reloaded
  delegate_to: "{{ vault_nginx_host }}"
  when: vault_nginx_block.changed

- name: Check Vault UI through NGINX
  ansible.builtin.uri:
    url: https://127.0.0.1/ui/
    method: HEAD
    headers:
      Host: "{{ vault_public_hostname }}"
    validate_certs: false
    status_code: 200
    return_content: false
  delegate_to: "{{ vault_nginx_host }}"
  register: vault_nginx_ui

- name: Require Vault UI through the public endpoint
  ansible.builtin.assert:
    that: vault_nginx_ui.status == 200
