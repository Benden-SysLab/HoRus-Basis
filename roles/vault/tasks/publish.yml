---

- name: Install Vault NGINX service block
  ansible.builtin.template:
    src: nginx/30_vault.conf.j2
    dest: "{{ vault_nginx_conf_path }}"
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ vault_nginx_host }}"
  register: vault_nginx_block

- name: Install Vault dashboard manifest
  ansible.builtin.template:
    src: nginx/vault.json.j2
    dest: "{{ vault_nginx_manifest_path }}"
    owner: root
    group: www-data
    mode: "0644"
  delegate_to: "{{ vault_nginx_host }}"

- name: Validate NGINX after publishing Vault
  ansible.builtin.command: nginx -t
  delegate_to: "{{ vault_nginx_host }}"
  changed_when: false

- name: Reload NGINX after publishing Vault
  ansible.builtin.service:
    name: nginx
    state: reloaded
  delegate_to: "{{ vault_nginx_host }}"
  when: vault_nginx_block.changed
