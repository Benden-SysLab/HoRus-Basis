---

- name: Install Vault repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - openssl
      - postgresql-client
    state: present
    update_cache: false

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download HashiCorp repository key
  ansible.builtin.get_url:
    url: "{{ vault_repository_key_url }}"
    dest: /etc/apt/keyrings/hashicorp.asc
    owner: root
    group: root
    mode: '0644'

- name: Convert HashiCorp repository key
  ansible.builtin.command:
    cmd: "gpg --dearmor --yes --output {{ vault_repository_keyring }} /etc/apt/keyrings/hashicorp.asc"
    creates: "{{ vault_repository_keyring }}"

- name: Configure HashiCorp APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ vault_repository_keyring }}]
      {{ vault_repository_url }}
      {{ vault_repository_distribution }} main
    filename: hashicorp
    state: present
    update_cache: true

- name: Install Vault package
  ansible.builtin.apt:
    name: "{{ vault_package_name }}"
    state: present
    update_cache: false


