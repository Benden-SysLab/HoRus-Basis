---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart Gitea
  ansible.builtin.systemd_service:
    name: "{{ gitea_service_name }}"
    state: restarted

- name: Restart Gitea SSH
  ansible.builtin.systemd_service:
    name: "{{ gitea_ssh_service_name }}"
    state: restarted

