---
- name: Check for managed SSH allowlist
  ansible.builtin.stat:
    path: "{{ gitea_ssh_allowlist_path }}"
  register: gitea_ssh_allowlist

- name: Require managed SSH allowlist
  ansible.builtin.assert:
    that: gitea_ssh_allowlist.stat.isreg | default(false)
    fail_msg: >-
      Managed SSH allowlist {{ gitea_ssh_allowlist_path }} was not found;
      refusing to modify an unknown SSH policy.

- name: Permit Gitea system account in managed SSH allowlist
  ansible.builtin.replace:
    path: "{{ gitea_ssh_allowlist_path }}"
    regexp: '^(AllowUsers(?![^\n]*[ \t]{{ gitea_system_user | regex_escape }}(?:[ \t]|$))[^\n]*)$'
    replace: '\1 {{ gitea_system_user }}'
  register: gitea_ssh_allowlist_update
  notify: Restart Gitea SSH

- name: Read managed SSH allowlist after Gitea update
  ansible.builtin.slurp:
    src: "{{ gitea_ssh_allowlist_path }}"
  register: gitea_ssh_allowlist_content

- name: Require Gitea account in managed SSH allowlist
  ansible.builtin.assert:
    that:
      - >-
        gitea_system_user in
        ((gitea_ssh_allowlist_content.content | b64decode)
         | regex_findall('(?m)^AllowUsers[ \\t]+([^\\n]+)$')
         | join(' ')
         | split)
    fail_msg: Gitea system account is absent from the managed SSH AllowUsers policy.

- name: Validate SSH configuration after Gitea allowlist update
  ansible.builtin.command:
    argv: [/usr/sbin/sshd, -t]
  changed_when: false

- name: Install Gitea configuration
  ansible.builtin.template:
    src: app.ini.j2
    dest: "{{ gitea_config_path }}"
    owner: root
    group: "{{ gitea_system_group }}"
    mode: "0640"
  no_log: true
  notify: Restart Gitea

- name: Install Gitea systemd service
  ansible.builtin.template:
    src: gitea.service.j2
    dest: /etc/systemd/system/gitea.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Gitea

- name: Enable and start Gitea
  ansible.builtin.systemd_service:
    name: "{{ gitea_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Start and diagnose Gitea readiness
  block:
    - name: Wait for local Gitea HTTP endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ gitea_http_port }}/api/healthz"
        status_code: 200
      register: gitea_ready
      retries: 12
      delay: 5
      until: gitea_ready.status == 200
  rescue:
    - name: Read failed Gitea service status
      ansible.builtin.command:
        argv: [systemctl, --no-pager, --full, status, gitea]
      register: gitea_failed_status
      changed_when: false
      failed_when: false

    - name: Read failed Gitea journal
      ansible.builtin.command:
        argv: [journalctl, --no-pager, -u, gitea, -n, "120"]
      register: gitea_failed_journal
      changed_when: false
      failed_when: false

    - name: Report Gitea startup failure
      ansible.builtin.fail:
        msg: |-
          Gitea did not become ready.
          === systemctl status ===
          {{ gitea_failed_status.stdout | default('unavailable') }}
          {{ gitea_failed_status.stderr | default('') }}
          === journal ===
          {{ gitea_failed_journal.stdout | default('unavailable') }}
          {{ gitea_failed_journal.stderr | default('') }}

- name: Create Gitea bootstrap administrator
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ gitea_system_user }}"
      - --
      - "{{ gitea_binary_path }}"
      - admin
      - user
      - create
      - --config
      - "{{ gitea_config_path }}"
      - --username
      - "{{ gitea_bootstrap_user }}"
      - --password
      - "{{ gitea_bootstrap_password }}"
      - --email
      - "{{ gitea_bootstrap_email }}"
      - --admin
      - --must-change-password=false
  register: gitea_admin_create
  changed_when: gitea_admin_create.rc == 0
  failed_when:
    - gitea_admin_create.rc != 0
    - "'already exists' not in (gitea_admin_create.stdout ~ gitea_admin_create.stderr)"
  no_log: true

