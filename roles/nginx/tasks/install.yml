---

- name: Read installed package state for NGINX
  ansible.builtin.package_facts:
    manager: auto

- name: Determine missing NGINX packages
  ansible.builtin.set_fact:
    nginx_missing_packages: >-
      {{
        [nginx_package_name, nginx_stream_package_name, 'openssl']
        | reject('in', ansible_facts.packages)
        | list
      }}

- name: Report missing NGINX packages
  ansible.builtin.debug:
    msg: "Missing NGINX packages: {{ nginx_missing_packages | join(', ') }}"
  when: nginx_missing_packages | length > 0

- name: Refresh APT metadata for missing NGINX packages
  ansible.builtin.command:
    cmd: apt-get update
  changed_when: false
  when: nginx_missing_packages | length > 0

- name: Install missing NGINX packages
  ansible.builtin.apt:
    name: "{{ nginx_missing_packages }}"
    state: present
    update_cache: false
  when: nginx_missing_packages | length > 0


