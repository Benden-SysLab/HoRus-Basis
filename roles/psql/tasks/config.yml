---

- name: Install PostgreSQL configuration
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ postgresql_config_directory }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: '0640'
  notify: Restart PostgreSQL

- name: Install PostgreSQL local authentication policy
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_config_directory }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: '0640'
  notify: Restart PostgreSQL

- name: Enable and start the PostgreSQL cluster
  ansible.builtin.systemd_service:
    name: "{{ postgresql_service_name }}"
    enabled: true
    state: started


