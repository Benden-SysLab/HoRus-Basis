---

- name: Install PostgreSQL configuration
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ postgresql_config_directory }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: '0640'
  notify: Restart PostgreSQL

- name: Install PostgreSQL local authentication policy
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_config_directory }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: '0640'
  notify: Restart PostgreSQL

- name: Enable and start the PostgreSQL cluster
  ansible.builtin.systemd_service:
    name: "{{ postgresql_service_name }}"
    enabled: true
    state: started

- name: Enable pg_stat_statements in the administrative database
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -X
      - -v
      - ON_ERROR_STOP=1
      - -d
      - postgres
      - -c
      - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
  changed_when: false


