---
- name: Require trust-zone Ansible SSH credentials
  ansible.builtin.assert:
    that:
      - ansible_controller_ssh_keys | length == 4
      - ansible_controller_ssh_keys | map(attribute='name') | unique | length == 4
      - ansible_controller_ssh_keys | map(attribute='filename') | unique | length == 4
    fail_msg: Four distinct trust-zone SSH keys are required.
  no_log: true

- name: Create Ansible SSH directory
  ansible.builtin.file:
    path: "{{ ansible_controller_ssh_dir }}"
    state: directory
    owner: "{{ ansible_controller_operator }}"
    group: "{{ ansible_controller_group }}"
    mode: "0700"

- name: Install trust-zone Ansible private keys
  ansible.builtin.copy:
    dest: "{{ ansible_controller_ssh_dir }}/{{ ansible_ssh_key.filename }}"
    content: "{{ ansible_ssh_key.private_key | trim }}\n"
    owner: "{{ ansible_controller_operator }}"
    group: "{{ ansible_controller_group }}"
    mode: "0600"
  loop: "{{ ansible_controller_ssh_keys }}"
  loop_control:
    loop_var: ansible_ssh_key
    label: "{{ ansible_ssh_key.filename }}"
  no_log: true

- name: Install trust-zone Ansible public keys
  ansible.builtin.copy:
    dest: "{{ ansible_controller_ssh_dir }}/{{ ansible_ssh_key.filename }}.pub"
    content: "{{ ansible_ssh_key.public_key | trim }}\n"
    owner: "{{ ansible_controller_operator }}"
    group: "{{ ansible_controller_group }}"
    mode: "0644"
  loop: "{{ ansible_controller_ssh_keys }}"
  loop_control:
    loop_var: ansible_ssh_key
    label: "{{ ansible_ssh_key.filename }}.pub"

