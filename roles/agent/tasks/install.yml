---
- name: Install Jenkins agent runtime and build baseline
  ansible.builtin.apt:
    name:
      - "{{ jenkins_agent_java_package }}"
      - git
      - openssh-server
      - build-essential
      - curl
      - jq
      - rsync
      - unzip
    state: present
    update_cache: true

- name: Require configured Jenkins agent Java runtime
  ansible.builtin.stat:
    path: "{{ jenkins_agent_java_command }}"
  register: jenkins_agent_java_runtime

- name: Validate configured Jenkins agent Java runtime
  ansible.builtin.assert:
    that: jenkins_agent_java_runtime.stat.isreg | default(false)
    fail_msg: >-
      Jenkins agent Java {{ jenkins_agent_java_major_version }} runtime is
      missing at {{ jenkins_agent_java_command }} after installing
      {{ jenkins_agent_java_package }}.

- name: Read Jenkins agent system Java alternative
  ansible.builtin.command: readlink -f /usr/bin/java
  register: jenkins_agent_system_java
  changed_when: false

- name: Select Java runtime for Jenkins agent
  ansible.builtin.command:
    argv:
      - update-alternatives
      - --set
      - java
      - "{{ jenkins_agent_java_command }}"
  when: jenkins_agent_system_java.stdout | trim != jenkins_agent_java_command

- name: Create Jenkins agent system group
  ansible.builtin.group:
    name: "{{ jenkins_agent_group }}"
    system: true

- name: Create Jenkins agent system user
  ansible.builtin.user:
    name: "{{ jenkins_agent_user }}"
    group: "{{ jenkins_agent_group }}"
    home: "{{ jenkins_agent_home }}"
    shell: /bin/bash
    system: true
    create_home: true
    password: "{{ jenkins_agent_account_password_hash }}"
    update_password: on_create
    password_lock: false
  no_log: true

- name: Enable and start SSH for Jenkins agent
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: started
# Reserved for install tasks of the agent service.

