---
- name: Require Jenkins credentials
  ansible.builtin.assert:
    that:
      - jenkins_oidc_client_secret | length > 0
      - jenkins_recovery_password | length > 0
      - access_admin_user | length > 0
      - access_admin_password | length > 0
    fail_msg: Required Jenkins or Access credentials are missing from KeePass.
  no_log: true

- name: Install Jenkins components
  ansible.builtin.include_tasks: install.yml
- name: Configure Jenkins single sign-on
  ansible.builtin.include_tasks: oidc.yml
- name: Configure Jenkins
  ansible.builtin.include_tasks: config.yml
- name: Install shared operator tools for Jenkins
  ansible.builtin.include_role:
    name: common_tools
- name: Install and configure Fluent Bit for Jenkins
  ansible.builtin.include_role:
    name: fluent_bit
- name: Apply pending Jenkins handlers
  ansible.builtin.meta: flush_handlers
- name: Publish Jenkins in central DNS
  ansible.builtin.include_role:
    name: technitium_dns
  vars:
    technitium_dns_record_name: "{{ jenkins_public_hostname }}"
    technitium_dns_record_address: "{{ horus_portal_dns_address }}"
- name: Publish Jenkins through NGINX
  ansible.builtin.include_tasks: publish.yml
- name: Validate Jenkins
  ansible.builtin.include_tasks: test.yml

