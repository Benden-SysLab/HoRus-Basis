---
- name: Check Jenkins service
  ansible.builtin.command: systemctl is-active jenkins
  register: jenkins_service_state
  changed_when: false

- name: Require Jenkins service to be active
  ansible.builtin.assert:
    that: jenkins_service_state.stdout | trim == 'active'

- name: Read Jenkins process Java version
  ansible.builtin.command: "{{ jenkins_java_command }} -version"
  register: jenkins_runtime_java
  changed_when: false

- name: Require Java 25 for Jenkins
  ansible.builtin.assert:
    that:
      - >-
        jenkins_runtime_java.stderr is
        search('version "' ~ jenkins_java_major_version ~ '[.]')

- name: Read Jenkins controller process ID
  ansible.builtin.command:
    argv: [systemctl, show, --property=MainPID, --value, jenkins]
  register: jenkins_main_pid
  changed_when: false

- name: Read Jenkins controller process executable
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - "/proc/{{ jenkins_main_pid.stdout | trim }}/exe"
  register: jenkins_process_java
  changed_when: false

- name: Require Jenkins controller process on Java 25
  ansible.builtin.assert:
    that:
      - (jenkins_main_pid.stdout | trim) not in ['', '0']
      - jenkins_process_java.stdout | trim == jenkins_java_command
    fail_msg: >-
      Jenkins process uses {{ jenkins_process_java.stdout | trim }}, expected
      {{ jenkins_java_command }}.

- name: Check local Jenkins endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jenkins_http_port }}/login"
    status_code: [200, 302, 403]

- name: Check public Jenkins endpoint
  ansible.builtin.uri:
    url: https://127.0.0.1/login
    headers:
      Host: "{{ jenkins_public_hostname }}"
    validate_certs: false
    status_code: [200, 302, 403]
  delegate_to: "{{ jenkins_nginx_host }}"

