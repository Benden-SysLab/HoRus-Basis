---
- name: Install Vikunja PostgreSQL access rule
  ansible.builtin.lineinfile:
    path: "{{ vikunja_postgres_config_path }}"
    line: >-
      host    {{ vikunja_postgres_database }}    {{ vikunja_postgres_user }}
      {{ hostvars['horus-vkj-srv01'].ansible_host }}/32    scram-sha-256
    insertafter: EOF
    state: present
  delegate_to: horus-db-srv03
  register: vikunja_postgres_hba

- name: Reload PostgreSQL after Vikunja policy change
  ansible.builtin.systemd_service:
    name: "{{ vikunja_postgres_service_name }}"
    state: reloaded
  delegate_to: horus-db-srv03
  when: vikunja_postgres_hba.changed

- name: Check Vikunja PostgreSQL role
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, -X, -A, -t, -d, postgres, -c, "SELECT 1 FROM pg_roles WHERE rolname='vikunja';"]
  delegate_to: horus-db-srv03
  register: vikunja_postgres_role
  changed_when: false

- name: Create Vikunja PostgreSQL role
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, -X, -v, ON_ERROR_STOP=1, -d, postgres, -c, "CREATE ROLE vikunja LOGIN;"]
  delegate_to: horus-db-srv03
  when: vikunja_postgres_role.stdout | trim != '1'

- name: Set Vikunja PostgreSQL password
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, -X, -v, ON_ERROR_STOP=1, -d, postgres]
    stdin: |-
      \getenv vikunja_password VIKUNJA_POSTGRES_PASSWORD
      ALTER ROLE vikunja PASSWORD :'vikunja_password';
  environment:
    VIKUNJA_POSTGRES_PASSWORD: "{{ vikunja_postgres_password }}"
  delegate_to: horus-db-srv03
  changed_when: false
  no_log: true

- name: Check Vikunja PostgreSQL database
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, -X, -A, -t, -d, postgres, -c, "SELECT 1 FROM pg_database WHERE datname='vikunja';"]
  delegate_to: horus-db-srv03
  register: vikunja_postgres_database_check
  changed_when: false

- name: Create Vikunja PostgreSQL database
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, createdb, -O, vikunja, vikunja]
  delegate_to: horus-db-srv03
  when: vikunja_postgres_database_check.stdout | trim != '1'

- name: Restrict Vikunja database connection privileges
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, -X, -v, ON_ERROR_STOP=1, -d, postgres]
    stdin: |-
      REVOKE CONNECT ON DATABASE vikunja FROM PUBLIC;
      GRANT CONNECT ON DATABASE vikunja TO vikunja;
  delegate_to: horus-db-srv03
  changed_when: false

- name: Verify Vikunja database login from Vikunja host
  ansible.builtin.command:
    argv: [psql, -h, "{{ vikunja_postgres_host }}", -p, "{{ vikunja_postgres_port }}", -U, vikunja, -d, vikunja, -X, -A, -t, -c, "SELECT current_user;"]
  environment:
    PGPASSWORD: "{{ vikunja_postgres_password }}"
  changed_when: false
  no_log: true
