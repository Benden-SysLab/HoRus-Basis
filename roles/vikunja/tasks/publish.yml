---
- name: Install Vikunja NGINX service block
  ansible.builtin.template:
    src: nginx/61_vikunja.conf.j2
    dest: "{{ vikunja_nginx_conf_path }}"
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ vikunja_nginx_host }}"
  register: vikunja_nginx_block

- name: Install Vikunja dashboard manifest
  ansible.builtin.template:
    src: nginx/vikunja.json.j2
    dest: "{{ vikunja_nginx_manifest_path }}"
    owner: root
    group: www-data
    mode: "0644"
  delegate_to: "{{ vikunja_nginx_host }}"

- name: Validate NGINX after publishing Vikunja
  ansible.builtin.command: nginx -t
  delegate_to: "{{ vikunja_nginx_host }}"
  changed_when: false

- name: Reload NGINX after publishing Vikunja
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  delegate_to: "{{ vikunja_nginx_host }}"
  when: vikunja_nginx_block.changed

- name: Check Vikunja through NGINX
  ansible.builtin.uri:
    url: https://127.0.0.1/api/v1/info
    headers:
      Host: "{{ vikunja_public_hostname }}"
    validate_certs: false
    status_code: 200
  delegate_to: "{{ vikunja_nginx_host }}"
