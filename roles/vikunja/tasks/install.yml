---
- name: Install Vikunja repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
      - postgresql-client
    state: present
    update_cache: true

- name: Download pinned Vikunja release from GitHub
  ansible.builtin.get_url:
    url: "{{ vikunja_package_url }}"
    dest: "{{ vikunja_package_path }}"
    owner: root
    group: root
    mode: "0644"
    timeout: 600
    force: false

- name: Install pinned Vikunja release
  ansible.builtin.apt:
    deb: "{{ vikunja_package_path }}"
    state: present

- name: Check installed Vikunja executable
  ansible.builtin.stat:
    path: "{{ vikunja_binary_path }}"
    follow: true
  register: vikunja_binary

- name: Require installed Vikunja executable
  ansible.builtin.assert:
    that:
      - vikunja_binary.stat.isreg | default(false)
      - vikunja_binary.stat.executable | default(false)
    fail_msg: >-
      The Vikunja package is installed but its executable was not found at
      {{ vikunja_binary_path }}.

- name: Create Vikunja system group
  ansible.builtin.group:
    name: "{{ vikunja_system_group }}"
    system: true

- name: Create Vikunja service account
  ansible.builtin.user:
    name: "{{ vikunja_system_user }}"
    group: "{{ vikunja_system_group }}"
    home: "{{ vikunja_data_dir }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Create Vikunja directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vikunja_system_user }}"
    group: "{{ vikunja_system_group }}"
    mode: "0750"
  loop:
    - "{{ vikunja_config_dir }}"
    - "{{ vikunja_data_dir }}"
    - "{{ vikunja_files_dir }}"
    - "{{ vikunja_log_dir }}"
